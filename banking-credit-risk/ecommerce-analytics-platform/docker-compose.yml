version: "3.9"

x-airflow-common:
  &airflow-common

  build:
    context: ./airflow
    dockerfile: Dockerfile

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow

    AIRFLOW__CORE__LOAD_EXAMPLES: "False"

    AIRFLOW_UID: 50000

    PYTHONPATH: /opt/airflow

    #Ecommerce PostgreSQL connection
    ECOMMERCE_DB_HOST: postgres
    ECOMMERCE_DB_PORT: 5432
    ECOMMERCE_DB_NAME: ecommerce
    ECOMMERCE_DB_USER: postgres
    ECOMMERCE_DB_PASSWORD: postgres

    # MinIO connection
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_BUCKET: raw

  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/requirements.txt:/requirements.txt
    - ./ingestion:/opt/airflow/ingestion
    - ./dbt:/opt/airflow/dbt
    - ./:/opt/airflow/project

services:

  airflow-init:
    <<: *airflow-common

    command: >
      bash -c "
      pip install -r /requirements.txt &&
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "

    depends_on:
      - postgres

  airflow-webserver:
    <<: *airflow-common

    command: >
      bash -c "
      pip install -r /requirements.txt &&
      airflow webserver
      "

    ports:
      - "8080:8080"

    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common

    command: >
      bash -c "
      pip install -r /requirements.txt &&
      airflow scheduler
      "

    depends_on:
      - airflow-init

  postgres:
    image: postgres:16

    container_name: ecommerce-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio

    container_name: ecommerce-minio

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: ecommerce-superset

    ports:
      - "8088:8088"

    environment:
      SUPERSET_SECRET_KEY: "ecommerce_superset_secret_key_2026_sept"

    volumes:
      - ./data:/app/data

    command: >
      /bin/sh -c "
        superset db upgrade &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088
      "

    restart: unless-stopped

    depends_on:
      - postgres

volumes:

  postgres_data:

  minio_data: